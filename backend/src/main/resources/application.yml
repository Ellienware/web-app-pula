spring:
  application:
    name: momocircle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# Dev profile: in-memory H2 so the slice runs with zero external setup.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:momocircle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration/*.sql), not Hibernate. `validate`
      # catches entity/schema drift immediately instead of silently patching
      # tables at boot, which is unsafe once this profile's data matters.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    # Dev-only fallback so a fresh checkout runs with zero setup. Never used in prod
    # (see the prod block below, which has no default and fails fast instead).
    jwt-secret: ${JWT_SECRET:change-me-in-prod-this-is-a-dev-only-secret-key-256bits!!}

---
# Prod profile: Postgres (e.g. Neon / RDS). Provide DATABASE_URL etc via env.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    # No default here on purpose: the app must fail to start on "prod" rather
    # than silently run with the dev secret. Set JWT_SECRET as a real env var
    # (256+ bits) before deploying.
    jwt-secret: ${JWT_SECRET}

---
# Shared, non-profile config
server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      # Seller image uploads (POST /api/images). The service also enforces 2 MB and checks the file's real type.
      max-file-size: 2MB
      max-request-size: 3MB

app:
  security:
    jwt-expiration-ms: 86400000
    # Basic brute-force protection on POST /api/auth/login — see LoginRateLimiter.
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:8}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  payouts:
    # sandbox only. Stitch/real payout providers do not exist and are rejected at startup (ProductionSafetyCheck).
    provider: ${PAYOUT_PROVIDER:sandbox}
  # Phase 7 transaction-risk layer. OPERATOR-ONLY: no request, header or user role can change these.
  #   mode ENFORCE (default): holds/blocks are enforced.  SHADOW: assess + audit only, for a controlled rollout.
  #   taxi-enabled: PULA Ride is the ONLY path that can be switched off (default false so the taxi flow is unchanged).
  #   Per-type thresholds (placeholders until calibrated on real data) can be overridden, e.g.
  #   app.risk.types.stock-order.hard-limit / review-amount / step-up-amount / max-attempts-per-hour / failure-lock-threshold
  risk:
    mode: ${RISK_MODE:ENFORCE}
    rule-set-version: ${RISK_RULE_SET_VERSION:2026.10-v1}
    validity-minutes: ${RISK_VALIDITY_MINUTES:15}
    taxi-enabled: ${RISK_TAXI_ENABLED:false}
  stock:
    unpaid-expiry-minutes: ${STOCK_UNPAID_EXPIRY_MINUTES:30}
  food:
    # PULA Food placeholders — confirm before launch.
    accept-timeout-minutes: ${FOOD_ACCEPT_TIMEOUT_MINUTES:10}
    max-accept-timeout-minutes: ${FOOD_MAX_ACCEPT_TIMEOUT_MINUTES:15}
    min-pula-ride-delivery-fee: ${FOOD_MIN_RIDE_DELIVERY_FEE:0}
    no-driver-notify-minutes: ${FOOD_NO_DRIVER_NOTIFY_MINUTES:10}
    no-driver-cancel-minutes: ${FOOD_NO_DRIVER_CANCEL_MINUTES:20}
    processing-expiry-minutes: ${STOCK_PROCESSING_EXPIRY_MINUTES:120}
    # Refund retry ceiling before a refund is flagged NEEDS_ATTENTION for an admin.
    refund-max-attempts: ${FOOD_REFUND_MAX_ATTEMPTS:10}
    # Restaurant settlement + merchant protection. ALL PLACEHOLDERS: PULA must confirm the commercial terms.
    settlement:
      commission-rate: ${FOOD_COMMISSION_RATE:0.00}                       # share of food revenue PULA keeps (0.00-1.00)
      fixed-fee: ${FOOD_SETTLEMENT_FIXED_FEE:0.00}                        # flat fee per order
      delay-minutes: ${FOOD_SETTLEMENT_DELAY_MINUTES:0}                   # dispute window after COMPLETED before payout
      compensation-commission-rate: ${FOOD_COMPENSATION_COMMISSION_RATE:0.00}
      compensate-pula-delivery-failure: ${FOOD_COMPENSATE_PULA_FAILURE:true}
      compensate-customer-cancelled-after-prep: ${FOOD_COMPENSATE_CUSTOMER_CANCEL:false}
      compensate-admin-cancelled-after-prep: ${FOOD_COMPENSATE_ADMIN_CANCEL:false}
      stuck-processing-minutes: ${FOOD_SETTLEMENT_STUCK_MINUTES:10}
      max-payout-attempts: ${FOOD_SETTLEMENT_MAX_ATTEMPTS:5}
  marketplace:
    # Unified marketplace settlement for retail, stock and services (Food keeps app.food.settlement above).
    # ALL PLACEHOLDERS: no commission, fee or dispute window is hard-coded. PULA must confirm the commercial terms.
    settlement:
      max-payout-attempts: ${MARKETPLACE_SETTLEMENT_MAX_ATTEMPTS:5}
      stuck-processing-minutes: ${MARKETPLACE_SETTLEMENT_STUCK_MINUTES:15}
      payout-run-ms: ${MARKETPLACE_SETTLEMENT_PAYOUT_RUN_MS:60000}
      retail:
        commission-rate: ${RETAIL_COMMISSION_RATE:0.00}
        fixed-fee: ${RETAIL_SETTLEMENT_FIXED_FEE:0.00}
        payment-fee-rate: ${RETAIL_PAYMENT_FEE_RATE:0.00}
        payment-fee-fixed: ${RETAIL_PAYMENT_FEE_FIXED:0.00}
        dispute-window-minutes: ${RETAIL_SETTLEMENT_DELAY_MINUTES:0}
      stock:
        commission-rate: ${STOCK_COMMISSION_RATE:0.00}
        fixed-fee: ${STOCK_SETTLEMENT_FIXED_FEE:0.00}
        payment-fee-rate: ${STOCK_PAYMENT_FEE_RATE:0.00}
        payment-fee-fixed: ${STOCK_PAYMENT_FEE_FIXED:0.00}
        dispute-window-minutes: ${STOCK_SETTLEMENT_DELAY_MINUTES:0}
      service:
        commission-rate: ${SERVICE_COMMISSION_RATE:0.00}
        fixed-fee: ${SERVICE_SETTLEMENT_FIXED_FEE:0.00}
        payment-fee-rate: ${SERVICE_PAYMENT_FEE_RATE:0.00}
        payment-fee-fixed: ${SERVICE_PAYMENT_FEE_FIXED:0.00}
        dispute-window-minutes: ${SERVICE_SETTLEMENT_DELAY_MINUTES:0}
  payments:
    # sandbox only. MTN MoMo was retired (Phase 10); any other value fails startup.
    provider: ${PAYMENT_PROVIDER:sandbox}
    # PULA Market collections. mock = SIMULATED hosted checkout, no external call, no real money.
    # Paystack was retired (Phase 10): any mode other than mock fails startup; no secret key is read.
    paystack:
      mode: ${PAYSTACK_MODE:mock}
      callback-url: ${PAYSTACK_CALLBACK_URL:}
    # legacy = original synchronous consumer checkout (default); paystack = simulated hosted-checkout flow (name is historical; Step 2 renames it).
    market-checkout: ${MARKET_CHECKOUT:legacy}
    # Pay PULA Market / PULA Food orders from the SIMULATED PULA Money wallet. No real money moves. Set false to hide the option.
    wallet-checkout:
      enabled: ${WALLET_CHECKOUT_ENABLED:true}
    # How long a Payment may sit in PROCESSING before PaymentReconciliationService
    # auto-expires it to FAILED (releasing any reserved marketplace stock). Applies
    # equally to payments that never reached the provider at all. See that class's
    # javadoc for the full policy.
    processing-timeout-minutes: ${PAYMENT_PROCESSING_TIMEOUT_MINUTES:30}
    # Hard ceiling FinancialValidationService enforces on every amount in the app
    # (contributions, payment requests, goals, expenses, recurring plans, product
    # prices) — regardless of whether it came from a manual form, the AI assistant,
    # or any other API client. Not a per-market MTN limit (MTN's own transaction
    # limits are enforced by MTN itself); this is this app's own sanity ceiling.
    max-amount: ${PAYMENT_MAX_AMOUNT:10000000}
  currency:
    # --- How to change market ---
    # This deployment targets South Africa, so it ships defaulting to ZAR. To point
    # a deployment at a different MTN MoMo market, set two env vars — no code
    # change needed:
    #   DEFAULT_CURRENCY=GHS               (Ghana)
    #   SUPPORTED_CURRENCIES=GHS           (or a comma list if you accept more than one)
    # or for Cameroon: DEFAULT_CURRENCY=XAF, SUPPORTED_CURRENCIES=XAF
    # Every service that used to hard-code "XAF" (ProductService, CircleService,
    # AssistantService) reads this instead — see CurrencyProperties.
    default-currency: ${DEFAULT_CURRENCY:ZAR}
    supported: ${SUPPORTED_CURRENCIES:ZAR}
  ai:
    # AI Gateway compatible endpoint. When unset, assistant falls back to a
    # deterministic heuristic parser so the slice works offline.
    gateway-url: ${AI_GATEWAY_URL:}
    api-key: ${AI_GATEWAY_API_KEY:}
    model: ${AI_MODEL:openai/gpt-4o-mini}
    # How long a stored AssistantProposal stays confirmable before execute()
    # rejects it as expired. See AssistantProposal / AssistantService's javadoc.
    proposal-expiry-minutes: ${AI_PROPOSAL_EXPIRY_MINUTES:10}
  sms:
    # sandbox only for now — see SmsProvider/SandboxSmsProvider. No real telecom SMS
    # gateway is wired up; this exists so a real one can be plugged in later.
    provider: ${SMS_PROVIDER:sandbox}
  momoride:
    # Rate limits protecting the taxi payment-code lookup/payment endpoints and the
    # USSD driver PIN from brute-force guessing — see PaymentCodeRateLimiter/UssdPinRateLimiter.
    payment-code-max-attempts: ${MOMORIDE_CODE_MAX_ATTEMPTS:20}
    payment-code-window-minutes: ${MOMORIDE_CODE_WINDOW_MINUTES:15}
    pin-max-attempts: ${MOMORIDE_PIN_MAX_ATTEMPTS:5}
    pin-lockout-minutes: ${MOMORIDE_PIN_LOCKOUT_MINUTES:15}
    # How often the stale-payment-request expiry sweep runs (see MoMoRideScheduledTasks).
    payment-request-expiry-check-ms: ${MOMORIDE_EXPIRY_CHECK_MS:60000}
    # Optional shared secret a real USSD gateway would send back on every callback —
    # see MoMoRideUssdController. Left unset in dev.
    ussd-shared-secret: ${MOMORIDE_USSD_SHARED_SECRET:}
  seed:
    # Dev profile only (see DevAdminSeeder) — bootstraps one ADMIN account so
    # /api/admin/** is reachable locally without a manual SQL step. Override
    # via env for anything beyond a laptop demo; never applies on "prod".
    admin-email: ${SEED_ADMIN_EMAIL:admin@momocircle.dev}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}
